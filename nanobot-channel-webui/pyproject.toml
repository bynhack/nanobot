[project]
name = "nanobot-channel-webui"
version = "0.1.1"
description = "Standalone WebUI channel plugin for nanobot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nanobot-ai>=0.2.0",
    "aiohttp>=3.9,<4",
    "loguru>=0.7",
    "pydantic>=2.0,<3",
]

[project.entry-points."nanobot.channels"]
webui_plugin = "nanobot_channel_webui:WebUIChannel"

[project.scripts]
nanobot-webui = "nanobot_channel_webui.cli:main"
nanobot-webui-business = "nanobot_channel_webui.business_modules.hr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanobot_channel_webui"]
ignore-vcs = true

[tool.hatch.build.targets.sdist]
include = [
    "src/nanobot_channel_webui",
    "frontend",
    "docs",
    "scripts",
    "README.md",
]
